<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0910">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Our Story">
<title>Our Story</title>
<link rel="icon" href="assets/heart.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/touch-icon.png">
<link rel="preload" href="assets/fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="vault/meta.json" as="fetch" crossorigin>
<link rel="stylesheet" href="assets/love.css">
<script>try{if(localStorage.getItem("ourstory.key.v1"))document.documentElement.classList.add("has-key")}catch(e){}</script>
</head>
<body class="is-locked">
<canvas id="sky" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<section class="lock" id="lock" aria-labelledby="lock-title">
  <div class="orbit" aria-hidden="true">
    <i class="ring"></i>
    <div class="spin"><span class="star a"></span><span class="star b"></span></div>
    <svg class="heart" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.2s-7.8-4.6-9.9-10C.7 7.6 2.9 3.6 6.8 3.6c2.2 0 3.9 1.2 5.2 3 1.3-1.8 3-3 5.2-3 3.9 0 6.1 4 4.7 7.6-2.1 5.4-9.9 10-9.9 10z"/></svg>
  </div>
  <p class="kicker">A private story</p>
  <h1 class="lock-title" id="lock-title"><em>Our Story</em></h1>
  <p class="lock-sub" id="lock-sub">只属于我们两个人的地方</p>
  <form id="lock-form" autocomplete="off" novalidate>
    <label class="sr-only" for="pw">密码</label>
    <div class="field">
      <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="输入我们的密码" enterkeyhint="go" autocapitalize="off" spellcheck="false">
      <button type="submit" aria-label="解锁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <label class="remember"><input type="checkbox" id="remember" checked> 在这台设备上记住我</label>
    <p class="hint" id="hint" hidden></p>
    <p class="error" id="err" role="alert" aria-live="polite"></p>
  </form>
</section>

<main id="story" hidden></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="照片">
  <div class="lb-stage" id="lb-stage"></div>
  <div class="lb-cap"><div class="d" id="lb-date"></div><p id="lb-text"></p></div>
  <span class="lb-n" id="lb-n"></span>
  <button class="lb-btn lb-close" id="lb-close" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="上一张"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button class="lb-btn lb-next" id="lb-next" aria-label="下一张"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
</div>

<noscript><p style="position:fixed;inset:auto 0 24px;text-align:center;color:#cbbac4">需要打开 JavaScript 才能看到我们的故事。</p></noscript>
<script src="assets/love.js" defer></script>
</body>
</html>
